name: GitHub Secrets Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demonstrate-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm secret is configured
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Demo secret is configured."
          else
            echo "Demo secret is missing."
            exit 1
          fi
